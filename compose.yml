# ESOCS Admin: production stack.
#
#   cp .env.docker.example .env      # fill in every value
#   make certs-init                  # first time only (Let's Encrypt)
#   make up
#
# Only the reverse proxy is published. The portal is reachable only through it.

name: esocs-admin

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  portal:
    <<: *hardening
    image: ${PORTAL_IMAGE:-esocs-admin}:${DEPLOYMENT_VERSION:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:?Set APP_URL in .env}
        NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES: ${IDLE_TIMEOUT_MINUTES:-15}
        DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-latest}
      secrets: [actions_key]
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:?Set BACKEND_API_URL in .env}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      FORM_EMBED_ORIGINS: ${FORM_EMBED_ORIGINS:-}
      ENABLE_DESIGN_SYSTEM: "false"
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:uid=1001,gid=1001,size=256m
    expose: ["3000"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
        reservations: { memory: 256m }

  proxy:
    <<: *hardening
    image: nginx:1.28-alpine
    depends_on:
      portal: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env}
      TLS_CERT_DIR: /etc/letsencrypt/live/${SERVER_NAME}
      # Only substitute our variables; nginx's own $vars stay untouched.
      NGINX_ENVSUBST_FILTER: "^(SERVER_NAME|TLS_CERT_DIR)$"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - ./docker/certs:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx:uid=101,gid=101
      - /var/run/nginx
      - /tmp
    # Master needs to bind 80/443 and switch to the nginx user; nothing else.
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  # Certificate issuance/renewal. Not started by `up`; see `make certs-init` / `make certs-renew`.
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./docker/certs:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
    networks: [edge]

networks:
  edge:
    driver: bridge

volumes:
  acme-webroot:

secrets:
  actions_key:
    environment: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
