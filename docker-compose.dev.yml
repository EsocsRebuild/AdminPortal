version: "3.8"

services:
  admin-portal-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: esocs-admin-portal-dev
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3001
      - TENANT_SLUG=esocs-dev
      - BACKEND_API_URL=http://localhost:4000
    command: npm run dev

