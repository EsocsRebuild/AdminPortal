services:
  admin-portal-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: esocs-admin-portal-dev
    ports:
      - "${PORT:-3002}:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=1
      - PORT=3001
      - TENANT_SLUG=esocs
      - BACKEND_API_URL=http://host.docker.internal:5080/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev
