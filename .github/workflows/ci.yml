name: Fast PR & CI Gate (Admin Portal)

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"

concurrency:
  group: ci-admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # Tier 1: Fast PR Sanity Gate (< 90 seconds)
  # Runs on every push to open PRs. Validates types, pure unit tests, and style.
  # =========================================================================
  fast-typecheck-and-unit:
    name: "Tier 1 - Types & Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  lint-and-format:
    name: "Tier 1 - Lint & Formatting Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # =========================================================================
  # Tier 2: Production Build Gate
  # Runs on every push to main/develop or ready PRs to verify build compilation.
  # =========================================================================
  build-and-verify:
    name: "Tier 2 - Production Build Verification"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [fast-typecheck-and-unit, lint-and-format]
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
