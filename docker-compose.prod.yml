# ==============================================================================
# ESOCS Administration Platform — Production Stack (Optimized Standalone)
# Run: docker compose -f docker-compose.prod.yml up --build -d
# ==============================================================================

name: esocs-admin-prod

services:
  admin-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: esocs/admin-portal:latest
    container_name: esocs-admin-portal
    restart: unless-stopped
    ports:
      - "${ADMIN_PROD_PORT:-3030}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - TENANT_SLUG=esocs
      - BACKEND_API_URL=http://host.docker.internal:5080/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - esocs-network

networks:
  esocs-network:
    name: esocs-network
