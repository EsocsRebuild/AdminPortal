services:
  admin-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: esocs/admin-portal:latest
    container_name: esocs-admin-portal
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TENANT_SLUG=esocs-main
      - BACKEND_API_URL=http://mock-api:4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mock-api:
        condition: service_healthy

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: esocs-mock-api
    command: npm run mock-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MOCK_API_PORT=4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

networks:
  default:
    name: esocs-network
