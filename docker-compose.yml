services:
  admin-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: esocs/admin-portal:latest
    container_name: esocs-admin-portal
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TENANT_SLUG=esocs-main
      - BACKEND_API_URL=http://mock-api:4000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mock-api:
        condition: service_healthy

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: esocs-mock-api
    command: npm run mock-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4000"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  default:
    name: esocs-network
