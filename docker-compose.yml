services:
  admin-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: esocs/admin-portal:latest
    container_name: esocs-admin-portal
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - TENANT_SLUG=esocs
      - BACKEND_API_URL=http://host.docker.internal:5080/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3030/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: esocs-network
