# Only if another proxy/CDN sits IN FRONT of nginx (e.g. Cloudflare, a cloud
# load balancer): trust its client-IP header from its address ranges only.
# Leave these commented when nginx faces the internet directly, otherwise
# clients could spoof their IP.
#
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;
