# Forward to the Next.js app. Included by every proxied location.
proxy_pass http://portal;
proxy_http_version 1.1;
proxy_set_header Connection "";

# $http_host keeps a non-default port (e.g. :8443), which Server Actions compare
# against the browser's Origin. server_name has already matched the hostname.
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
# Overwrite, never append: a client-supplied X-Forwarded-For must not reach the
# app, which uses this value for rate limiting and the audit log.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Request-Id      $request_id;

proxy_hide_header X-Powered-By;
proxy_buffers 16 16k;
proxy_buffer_size 16k;
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
