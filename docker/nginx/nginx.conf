# ESOCS Admin: reverse proxy (main config).
# Site config is rendered from templates/portal.conf.template at container start.

user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;
pid /var/run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ─── Hardening ─────────────────────────────────────────────────────────────
  server_tokens off;
  # Slow-client (slowloris) protection.
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  reset_timedout_connection on;
  # Largest legitimate payload is a CSV import chunk (the app caps it at 4 MB).
  client_max_body_size 5m;
  client_body_buffer_size 128k;
  large_client_header_buffers 4 16k;

  # ─── Logging (JSON, one line per request) ──────────────────────────────────
  log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"cache":"$upstream_cache_status",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer"'
  '}';
  access_log /dev/stdout json;

  # ─── Performance ───────────────────────────────────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/csv text/xml application/json application/javascript
             application/xml application/rss+xml image/svg+xml font/ttf font/otf;

  # Cache for fingerprinted /_next/static assets only (never HTML or data).
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=512m
                   inactive=30d use_temp_path=off;

  # ─── Rate limiting ─────────────────────────────────────────────────────────
  # Only POSTs count towards the auth and form zones (an empty key isn't limited).
  map $request_method $post_client {
    POST    $binary_remote_addr;
    default "";
  }
  limit_req_zone  $binary_remote_addr zone=per_ip:20m       rate=20r/s;
  limit_req_zone  $post_client        zone=auth:10m         rate=10r/m;
  limit_req_zone  $post_client        zone=public_forms:10m rate=6r/m;
  limit_req_zone  $binary_remote_addr zone=exports:10m      rate=6r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;

  # Keep-alive connections to the app.
  upstream portal {
    server portal:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
